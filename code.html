<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tinder Style Food Matcher</title>

<style>
body {
    font-family: Arial;
    background: radial-gradient(circle, #111, #000);
    color: white;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

.tags {
    margin: 20px;
}

.card {
    width: 300px;
    height: 180px;
    background: linear-gradient(145deg, #1f1f1f, #292929);
    margin: 20px auto;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 20px cyan;
}

button {
    font-size: 18px;
    padding: 10px 25px;
    margin: 10px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}

#nah {
    background: red;
    color: white;
}

#yeah {
    background: green;
    color: white;
}

#delay {
    margin-top: 15px;
    color: yellow;
}

/* POPUP STYLE */
.popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
}

.popup-content {
    background: #222;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 20px lime;
}
</style>
</head>

<body>

<h1>🍿 Can't Decide? Swipe!</h1>

<div class="tags">
    <label><input type="checkbox" value="spicy"> Spicy 🌶</label>
    <label><input type="checkbox" value="cheap"> Cheap 💸</label>
    <label><input type="checkbox" value="fast"> Fast ⚡</label>
</div>

<div id="card" class="card">
    <h2 id="item-name"></h2>
    <p id="item-tags"></p>
</div>

<button id="nah">❌ Nah</button>
<button id="yeah">✅ Yeah</button>

<p id="delay"></p>

<!-- EXIT POPUP -->
<div id="exitPopup" class="popup">
    <div class="popup-content">
        <h2>No more cards 😭</h2>
        <button onclick="exitApp()">Exit</button>
    </div>
</div>

<script>
const items = [
    { name: "Pizza 🍕", tags: ["cheap", "fast"] },
    { name: "Biryani 🍛", tags: ["spicy"] },
    { name: "Burger 🍔", tags: ["cheap", "fast"] },
    { name: "Sushi 🍣", tags: ["expensive"] }
];

let index = 0;

const card = document.getElementById("card");
const itemName = document.getElementById("item-name");
const itemTags = document.getElementById("item-tags");
const delayText = document.getElementById("delay");
const popup = document.getElementById("exitPopup");

function showCard() {
    if (index >= items.length) {
        card.style.display = "none";
        popup.style.display = "flex";   // SHOW POPUP
        return;
    }

    itemName.textContent = items[index].name;
    itemTags.textContent = "Tags: " + items[index].tags.join(", ");
}

showCard();

document.getElementById("nah").onclick = function() {
    card.style.display = "none";
    index++;
    setTimeout(function() {
        card.style.display = "block";
        showCard();
    }, 300);
};

document.getElementById("yeah").onclick = function() {
    const selectedTags = Array.from(
        document.querySelectorAll("input:checked")
    ).map(tag => tag.value);

    const match = items[index].tags.some(tag =>
        selectedTags.includes(tag)
    );

    if (match) {
        alert("🎉 MATCH FOUND!");
        card.style.boxShadow = "0 0 30px lime";
    }

    showFunnyDelay();
    index++;

    setTimeout(showCard, 500);
};

function showFunnyDelay() {
    const delays = [
        "Cow crossing the road 🐄 +5 mins",
        "Chef forgot salt 🧂 +3 mins",
        "Delivery guy vibing 🎧 +2 mins"
    ];

    delayText.textContent =
        delays[Math.floor(Math.random() * delays.length)];
}

function exitApp() {
    alert("Thanks for using the app 👋");
    window.close(); 
}
</script>

</body>
</html>
