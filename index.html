<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tinder Style Food Matcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🍿 Can't Decide? Swipe!</h1>

<div class="tags">
    <label><input type="checkbox" value="spicy"> Spicy 🌶</label>
    <label><input type="checkbox" value="cheap"> Cheap 💸</label>
    <label><input type="checkbox" value="fast"> Fast ⚡</label>
</div>

<div id="card" class="card">
    <h2 id="item-name"></h2>
    <p id="item-tags"></p>
</div>

<div class="buttons">
    <button id="nah">❌ Nah</button>
    <button id="yeah">✅ Yeah</button>
</div>

<p id="delay"></p>

<!-- Exit Popup -->
<div id="exitPopup" class="popup">
    <div class="popup-content">
        <h2>No more cards 😭</h2>
        <button onclick="exitApp()">Exit</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
